<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ULTIMA-ZONA // Ultimate Survival</title>
<style>
:root{--bg:#050b09;--panel:#0b1b15e8;--line:#345744;--text:#f2fff5;--muted:#a3b9aa;--green:#50f09a;--red:#ff6d78;--gold:#ffd36b;--blue:#77bfff}
*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#020504;color:var(--text);font-family:Inter,system-ui,Arial}canvas{display:block;width:100vw;height:100vh;touch-action:none}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.panel{background:var(--panel);border:1px solid #385d47;border-radius:15px;padding:10px 12px;box-shadow:0 8px 30px #0008;backdrop-filter:blur(10px)}.small{font-size:11px;color:var(--muted)}.big{font-size:17px;font-weight:850}.row{display:flex;gap:8px;align-items:center}.bar{height:7px;border-radius:99px;background:#173025;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;width:100%;background:var(--green)}
#right{text-align:right;min-width:145px}#tools{position:fixed;top:112px;right:10px;display:flex;flex-direction:column;gap:6px}button{border:1px solid #466d54;background:#10291e;color:var(--text);border-radius:11px;padding:9px 11px;font-weight:750;box-shadow:0 5px 15px #0004}button:active{transform:scale(.97)}button.active{background:#2c7c4e;border-color:#8cf5b0}
#bottom{position:fixed;left:0;right:0;bottom:0;padding:12px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}#joy,#shoot{pointer-events:auto;touch-action:none;user-select:none}
#joy{width:128px;height:128px;border:1px solid #416d53;background:#102b20aa;border-radius:50%;position:relative}#stick{position:absolute;left:35px;top:35px;width:58px;height:58px;border-radius:50%;background:#65b889aa;border:1px solid #9fe8bb}
#shoot{width:118px;height:118px;border-radius:50%;font-size:40px;background:#642e37dd;border:2px solid #b25c66}
#hint{position:fixed;bottom:4px;left:50%;transform:translateX(-50%);font-size:11px;color:#9db5a6;white-space:nowrap;pointer-events:none}
#toast{position:fixed;top:95px;left:50%;transform:translateX(-50%);opacity:0;transition:.2s;background:#102c1eee;border:1px solid #4b8760;border-radius:99px;padding:9px 14px;white-space:nowrap;pointer-events:none}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#020604d9;padding:18px}#box{width:min(470px,100%);max-height:80vh;overflow:auto;background:#0a1d14;border:1px solid #4b7659;border-radius:20px;padding:18px;box-shadow:0 20px 80px #0009}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.card{padding:10px;border-radius:12px;background:#102b1e;border:1px solid #2c523c}.muted{color:var(--muted)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
 <div class="panel"><div class="small">ULTIMA-ZONA // SURVIVAL</div><div class="big" id="phase">Giorno 1 · Onda 1</div><div class="bar"><i id="hpbar"></i></div><div class="small" id="hp">100 / 100 HP</div><div class="small" id="stamina">Stamina 100%</div></div>
 <div class="panel" id="right"><div class="small">SOPRAVVIVENZA</div><div class="big" id="score">0 eliminati</div><div class="small" id="lvl">Livello 1 · XP 0/100</div><div class="small" id="res">🪵0 · 🔩0 · 🧪0 · 💰0</div></div>
</div>
<div id="tools"><button id="mapBtn">🗺️ Mappa</button><button id="baseBtn">🏕️ Base</button><button id="bagBtn">🎒 Zaino</button><button id="weaponBtn">🔫 Arma</button></div>
<div id="toast"></div>
<div id="bottom"><div id="joy"><div id="stick"></div></div><button id="shoot">⚡</button></div>
<div id="hint">Muovi con il joystick · mira automatica al nemico più vicino · raccogli le risorse</div>
<div id="modal"><div id="box"><h2 id="mtitle"></h2><div id="mbody"></div><button id="close">Chiudi</button></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H,dpr;
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const S={day:1,wave:1,kills:0,level:1,xp:0,next:100,hp:100,maxHp:100,wood:0,metal:0,med:0,coins:0,damage:25,rate:310,weapon:1,base:1,spawn:0,last:0,gameOver:false,night:false,z:[],b:[],loot:[],structures:[]};
const P={x:0,y:0,r:15,speed:2.7,angle:0,stamina:100};
const keys={},joy={x:0,y:0,active:false};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key===' ')shoot()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
const joyEl=document.getElementById('joy'),stick=document.getElementById('stick');
function moveJoy(e){const r=joyEl.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.hypot(dx,dy)||1,max=r.width*.34;let x=dx,y=dy;if(m>max){x=x/m*max;y=y/m*max}joy.x=x/max;joy.y=y/max;stick.style.transform=`translate(${x}px,${y}px)`}
joyEl.onpointerdown=e=>{joy.active=true;joyEl.setPointerCapture(e.pointerId);moveJoy(e)};joyEl.onpointermove=e=>{if(joy.active)moveJoy(e)};joyEl.onpointerup=()=>{joy.active=false;joy.x=joy.y=0;stick.style.transform='translate(0,0)'};
document.getElementById('shoot').onpointerdown=shoot;
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,1600)}
function hud(){phase.textContent=`Giorno ${S.day} · Onda ${S.wave}${S.night?' · 🌙':''}`;hpbar.style.width=Math.max(0,S.hp/S.maxHp*100)+'%';hp.textContent=`${Math.ceil(S.hp)} / ${S.maxHp} HP`;stamina.textContent=`Stamina ${Math.round(P.stamina)}%`;score.textContent=S.kills+' eliminati';lvl.textContent=`Livello ${S.level} · XP ${S.xp}/${S.next}`;res.textContent=`🪵${S.wood} · 🔩${S.metal} · 🧪${S.med} · 💰${S.coins}`}
function xp(n){S.xp+=n;while(S.xp>=S.next){S.xp-=S.next;S.level++;S.next=Math.round(S.next*1.32);S.maxHp+=10;S.hp=S.maxHp;S.damage+=5;toast('⬆️ Nuovo livello '+S.level)}hud()}
function modal(t,b){mtitle.textContent=t;mbody.innerHTML=b;document.getElementById('modal').style.display='flex'}close.onclick=()=>modalEl().style.display='none';function modalEl(){return document.getElementById('modal')}
function nearest(){let t=null,best=1e9;for(const z of S.z){let d=Math.hypot(z.x-P.x,z.y-P.y);if(d<best&&d<520){best=d;t=z}}return t}
function shoot(){if(S.gameOver)return;let n=performance.now();if(n-S.last<S.rate)return;S.last=n;let t=nearest(),a=t?Math.atan2(t.y-P.y,t.x-P.x):P.angle;if(!t&&Math.abs(joy.x)+Math.abs(joy.y)>0)a=Math.atan2(joy.y,joy.x);P.angle=a;S.b.push({x:P.x,y:P.y,a,life:75,damage:S.damage})}
function spawn(){let e=Math.floor(Math.random()*4),d=470,x,y;if(e===0){x=P.x-W/2-d;y=P.y+(Math.random()-.5)*H}else if(e===1){x=P.x+W/2+d;y=P.y+(Math.random()-.5)*H}else if(e===2){x=P.x+(Math.random()-.5)*W;y=P.y-H/2-d}else{x=P.x+(Math.random()-.5)*W;y=P.y+H/2+d}let elite=Math.random()<Math.min(.18,S.day*.02);S.z.push({x,y,r:elite?20:13+Math.random()*5,hp:(elite?160:48)+S.day*8,speed:(elite?.28:.42+Math.random()*.2),elite,hit:0})}
function loot(x,y){if(Math.random()<.8)S.loot.push({x,y,t:Math.random()<.5?'wood':'metal'});if(Math.random()<.14)S.loot.push({x:x+9,y:y+5,t:'med'});if(Math.random()<.12)S.loot.push({x:x-8,y:y-4,t:'coin'})}
function hurt(n){S.hp-=n;if(S.hp<=0){S.hp=0;S.gameOver=true;modal('☠️ Fine della spedizione',`Hai eliminato <b>${S.kills}</b> zombie e raggiunto il livello <b>${S.level}</b>.<br><br><button onclick="location.reload()">Ricomincia</button>`)}}
function collect(){for(let i=S.loot.length-1;i>=0;i--){let l=S.loot[i];if(Math.hypot(l.x-P.x,l.y-P.y)<30){if(l.t==='wood')S.wood+=5;if(l.t==='metal')S.metal+=3;if(l.t==='med')S.med++;if(l.t==='coin')S.coins++;S.loot.splice(i,1);hud()}}}
function update(dt){if(S.gameOver)return;let mx=joy.x,my=joy.y;if(keys.w||keys.arrowup)my-=1;if(keys.s||keys.arrowdown)my+=1;if(keys.a||keys.arrowleft)mx-=1;if(keys.d||keys.arrowright)mx+=1;let m=Math.hypot(mx,my)||1;if(Math.abs(mx)+Math.abs(my)>0){P.x+=mx/m*P.speed*dt;P.y+=my/m*P.speed*dt;P.angle=Math.atan2(my,mx);P.stamina=Math.max(0,P.stamina-.35*dt)}else P.stamina=Math.min(100,P.stamina+.6*dt);collect();S.spawn-=dt;if(S.spawn<=0){spawn();S.spawn=Math.max(12,62-S.wave*3-S.day*1.5)}
for(let i=S.z.length-1;i>=0;i--){let z=S.z[i],dx=P.x-z.x,dy=P.y-z.y,d=Math.hypot(dx,dy)||1;z.x+=dx/d*z.speed*dt;z.y+=dy/d*z.speed*dt;if(d<z.r+P.r){z.hit-=dt;if(z.hit<=0){hurt(z.elite?10:4+S.day*.4);z.hit=45}}}
for(let i=S.b.length-1;i>=0;i--){let b=S.b[i];b.x+=Math.cos(b.a)*8.5*dt;b.y+=Math.sin(b.a)*8.5*dt;b.life-=dt;let gone=b.life<=0;for(let j=S.z.length-1;j>=0&&!gone;j--){let z=S.z[j];if(Math.hypot(z.x-b.x,z.y-b.y)<z.r+5){z.hp-=b.damage;gone=true;if(z.hp<=0){S.kills++;xp(z.elite?70:25);loot(z.x,z.y);S.z.splice(j,1);if(S.kills%12===0){S.wave++;if(S.wave>4){S.wave=1;S.day++;S.night=!S.night;toast('🌅 Nuovo giorno: '+S.day)}}}}}if(gone)S.b.splice(i,1)}hud()}
function w2s(x,y){return[x-P.x+W/2,y-P.y+H/2]}
function circle(x,y,r,fill,stroke){let[sx,sy]=w2s(x,y);if(sx<-r||sy<-r||sx>W+r||sy>H+r)return;ctx.beginPath();ctx.arc(sx,sy,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle=S.night?'#040b0c':'#071611';ctx.fillRect(0,0,W,H);let g=48,ox=((W/2-P.x)%g+g)%g,oy=((H/2-P.y)%g+g)%g;ctx.strokeStyle=S.night?'#10252b':'#123226';for(let x=ox;x<W;x+=g){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=oy;y<H;y+=g){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
for(let a=-2;a<=2;a++)for(let b=-2;b<=2;b++){let x=Math.round(P.x/520)*520+a*520,y=Math.round(P.y/520)*520+b*520;circle(x,y,105,'#153d2b','#2b6848');circle(x,y,62,'#1e5039','#397a55')}
for(const l of S.loot){circle(l.x,l.y,9,l.t==='wood'?'#c78b4d':l.t==='metal'?'#a7bcc5':l.t==='med'?'#e16e7c':'#f4cf65');let[sx,sy]=w2s(l.x,l.y);ctx.font='12px system-ui';ctx.fillStyle='#fff';ctx.fillText(l.t==='wood'?'🪵':l.t==='metal'?'🔩':l.t==='med'?'🧪':'💰',sx-8,sy-13)}
for(const b of S.b)circle(b.x,b.y,4,'#ffd36b');
for(const z of S.z){circle(z.x,z.y,z.r,z.elite?'#b65b31':'#8d454e',z.elite?'#ffbe65':'#d66a74');let[sx,sy]=w2s(z.x,z.y);ctx.fillStyle='#132016';ctx.fillRect(sx-17,sy-z.r-10,34,4);ctx.fillStyle='#63df88';ctx.fillRect(sx-17,sy-z.r-10,34*Math.max(0,z.hp/(z.elite?160:48+S.day*8)),4)}
let[sx,sy]=w2s(P.x,P.y);ctx.beginPath();ctx.arc(sx,sy,P.r,0,Math.PI*2);ctx.fillStyle='#e1f4e7';ctx.fill();ctx.strokeStyle='#6be69b';ctx.stroke();ctx.save();ctx.translate(sx,sy);ctx.rotate(P.angle);ctx.fillStyle='#50f09a';ctx.fillRect(0,-5,25,10);ctx.restore();if(S.night){ctx.fillStyle='#00110acc';ctx.fillRect(0,0,W,H);circle(P.x,P.y,150,'#00000000','#274b3b')}}
function upgradeBase(){let w=S.base*30,m=S.base*18;if(S.wood>=w&&S.metal>=m){S.wood-=w;S.metal-=m;S.base++;S.maxHp+=30;S.hp=S.maxHp;toast('🏕️ Base potenziata');hud();modalEl().style.display='none'}else toast('Risorse insufficienti')}
function upgradeWeapon(){let c=S.weapon*55;if(S.metal>=c){S.metal-=c;S.weapon++;S.damage+=14;S.rate=Math.max(125,S.rate-35);toast('🔫 Arma migliorata');hud();modalEl().style.display='none'}else toast('Metallo insufficiente')}
function useMed(){if(S.med>0&&S.hp<S.maxHp){S.med--;S.hp=Math.min(S.maxHp,S.hp+40);hud();modalEl().style.display='none'}else toast('Nessun medkit o salute già piena')}
mapBtn.onclick=()=>modal('🗺️ Mappa',`<p>Sei nel settore <b>${Math.floor(P.x/520)}, ${Math.floor(P.y/520)}</b>.</p><p>Le zone verdi rappresentano aree esplorabili. Il mondo è generato dinamicamente mentre ti muovi.</p><div class="card">Obiettivo: sopravvivi, raccogli risorse e potenzia la base.</div>`);
baseBtn.onclick=()=>modal('🏕️ Base',`<p>Livello base: <b>${S.base}</b></p><div class="grid"><div class="card">🪵 Legno<br><b>${S.wood}</b></div><div class="card">🔩 Metallo<br><b>${S.metal}</b></div></div><p>Potenzia la salute massima e prepara il rifugio.</p><button onclick="upgradeBase()">Potenzia · ${S.base*30} legno / ${S.base*18} metallo</button>`);
bagBtn.onclick=()=>modal('🎒 Zaino',`<div class="grid"><div class="card">🪵 Legno<br><b>${S.wood}</b></div><div class="card">🔩 Metallo<br><b>${S.metal}</b></div><div class="card">🧪 Medkit<br><b>${S.med}</b></div><div class="card">💰 Monete<br><b>${S.coins}</b></div></div><button onclick="useMed()">Usa medkit (+40 HP)</button>`);
weaponBtn.onclick=()=>modal('🔫 Arma',`<p>Livello arma: <b>${S.weapon}</b></p><p>Danno: ${S.damage} · Cadenza: ${S.rate} ms</p><button onclick="upgradeWeapon()">Migliora · ${S.weapon*55} metallo</button>`);
let last=performance.now();function loop(t){let dt=Math.min(2.5,(t-last)/16.67);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);hud();
</script>
</body></html>
