<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ULTIMA-ZONA Survival</title>
<style>
:root{--bg:#070b0b;--panel:#101919;--line:#29403b;--text:#ecf5ef;--muted:#9bb1a6;--accent:#47e18b;--danger:#ff5e66}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,Segoe UI,sans-serif;touch-action:none}
#game{display:block;width:100vw;height:100vh;background:#0b1512}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;justify-content:space-between;pointer-events:none;z-index:3}
.panel{background:rgba(7,13,12,.84);border:1px solid #2b463b;border-radius:14px;padding:8px 11px;box-shadow:0 6px 24px #0005;backdrop-filter:blur(8px)}
.small{font-size:12px;color:var(--muted)}.strong{font-weight:800}.bar{height:8px;width:130px;background:#27332e;border-radius:20px;overflow:hidden;margin-top:4px}.fill{height:100%;width:100%;background:var(--accent)}
#message{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;text-align:center;max-width:330px;display:none}
#message h1{margin:0 0 8px;font-size:30px;letter-spacing:1px}
button{border:1px solid #4b7c62;background:#183b2a;color:white;border-radius:12px;padding:12px 16px;font-weight:800;font-size:15px}
#controls{position:fixed;inset:auto 0 16px 0;display:flex;justify-content:space-between;align-items:end;padding:0 18px;z-index:3;pointer-events:none}
#pad{width:150px;height:150px;position:relative;pointer-events:auto}
.stick{position:absolute;width:54px;height:54px;border-radius:50%;background:#29453a;border:1px solid #5d8c72;left:48px;top:48px}
.pad-ring{position:absolute;inset:0;border-radius:50%;background:#10251c99;border:1px solid #355744}
#shoot{width:105px;height:105px;border-radius:50%;background:#572b2e;border:2px solid #cf6d6e;pointer-events:auto;display:grid;place-items:center;font-size:30px}
#hint{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);font-size:11px;color:#9bb1a6;z-index:3;white-space:nowrap}
@media(min-width:800px){#controls{padding:0 40px 28px}#pad{width:180px;height:180px}.stick{left:63px;top:63px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="panel"><div class="small">ULTIMA-ZONA</div><div class="strong" id="wave">Giorno 1 · Onda 1</div><div class="bar"><div id="hp" class="fill"></div></div></div>
  <div class="panel" style="text-align:right"><div class="small">ZOMBIE ELIMINATI</div><div class="strong" id="score">0</div><div class="small" id="ammo">Munizioni: ∞</div></div>
</div>
<div id="message" class="panel">
  <h1 id="msgTitle">ULTIMA-ZONA</h1><p id="msgText">Sopravvivi alle ondate.</p><button id="restart">Inizia</button>
</div>
<div id="controls">
  <div id="pad"><div class="pad-ring"></div><div id="stick" class="stick"></div></div>
  <div id="shoot">⚡</div>
</div>
<div id="hint">Muovi con il pad · Tocca ⚡ per sparare nella direzione dell'ultimo movimento</div>
<script>
(() => {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const hpEl=document.getElementById('hp'),scoreEl=document.getElementById('score'),waveEl=document.getElementById('wave');
const message=document.getElementById('message'),msgTitle=document.getElementById('msgTitle'),msgText=document.getElementById('msgText');
let W,H,dpr,world={w:2400,h:1600},camera={x:0,y:0},keys={},running=false,score=0,wave=1,spawned=0,kills=0;
let player,zombies=[],bullets=[],loot=[],particles=[],last=0,spawnTimer=0,shootCooldown=0,lastDir={x:1,y:0};
const input={x:0,y:0,active:false};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function reset(){score=0;wave=1;spawned=0;kills=0;zombies=[];bullets=[];loot=[];particles=[];player={x:world.w/2,y:world.h/2,r:18,hp:100,speed:245};running=true;message.style.display='none';last=performance.now();requestAnimationFrame(loop)}
function show(title,text,button='Ricomincia'){msgTitle.textContent=title;msgText.textContent=text;document.getElementById('restart').textContent=button;message.style.display='block'}
document.getElementById('restart').onclick=reset;
function rand(a,b){return a+Math.random()*(b-a)}
function spawnZombie(){let side=Math.floor(Math.random()*4),x,y;if(side===0){x=rand(0,world.w);y=-40}else if(side===1){x=world.w+40;y=rand(0,world.h)}else if(side===2){x=rand(0,world.w);y=world.h+40}else{x=-40;y=rand(0,world.h)}
zombies.push({x,y,r:rand(15,23),hp:30+wave*4,speed:rand(38,58)+wave*2,hit:0})
}
function shoot(){if(!running||shootCooldown>0)return;shootCooldown=.22;let a=Math.atan2(lastDir.y,lastDir.x);bullets.push({x:player.x+Math.cos(a)*22,y:player.y+Math.sin(a)*22,vx:Math.cos(a)*650,vy:Math.sin(a)*650,r:4,life:1.2})}
function moveInput(){let x=input.x,y=input.y;if(keys.ArrowLeft||keys.a)x-=1;if(keys.ArrowRight||keys.d)x+=1;if(keys.ArrowUp||keys.w)y-=1;if(keys.ArrowDown||keys.s)y+=1;let len=Math.hypot(x,y)||1;if(Math.hypot(x,y)>.1){x/=len;y/=len;lastDir={x,y}}return{x,y}}
function update(dt){if(!running)return;let m=moveInput();player.x=Math.max(30,Math.min(world.w-30,player.x+m.x*player.speed*dt));player.y=Math.max(30,Math.min(world.h-30,player.y+m.y*player.speed*dt));shootCooldown=Math.max(0,shootCooldown-dt);
spawnTimer-=dt;if(spawnTimer<=0&&zombies.length<Math.min(12+wave*3,45)){spawnZombie();spawned++;spawnTimer=Math.max(.22,1.0-wave*.045)}
for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt}
bullets=bullets.filter(b=>b.life>0&&b.x>-50&&b.y>-50&&b.x<world.w+50&&b.y<world.h+50);
for(const z of zombies){let dx=player.x-z.x,dy=player.y-z.y,d=Math.hypot(dx,dy)||1;z.x+=dx/d*z.speed*dt;z.y+=dy/d*z.speed*dt;if(d<z.r+player.r){player.hp-=18*dt;z.hit=.1}}
for(const b of bullets){for(const z of zombies){if(Math.hypot(b.x-z.x,b.y-z.y)<z.r+b.r){z.hp-=25;b.life=0;burst(z.x,z.y,'#f5c56a');break}}}
const before=zombies.length;zombies=zombies.filter(z=>{if(z.hp<=0){score+=10;kills++;burst(z.x,z.y,'#e85b63');return false}return true});
if(kills>=wave*12){wave++;spawned=0;show('Onda superata','Hai eliminato abbastanza zombie. Premi Inizia per continuare.','Continua');running=false}
if(player.hp<=0){running=false;show('Sei stato eliminato','Gli zombie hanno conquistato la zona.','Ricomincia')}
scoreEl.textContent=score;waveEl.textContent=`Giorno 1 · Onda ${wave}`;hpEl.style.width=Math.max(0,player.hp)+'%';
for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);
}
function burst(x,y,color){for(let i=0;i<8;i++)particles.push({x,y,vx:rand(-80,80),vy:rand(-80,80),life:rand(.2,.6),color})}
function draw(){ctx.clearRect(0,0,W,H);camera.x=Math.max(0,Math.min(world.w-W,player.x-W/2));camera.y=Math.max(0,Math.min(world.h-H,player.y-H/2));
ctx.save();ctx.translate(-camera.x,-camera.y);
ctx.fillStyle='#0c1b15';ctx.fillRect(0,0,world.w,world.h);
ctx.strokeStyle='#173326';ctx.lineWidth=1;for(let x=0;x<world.w;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,world.h);ctx.stroke()}for(let y=0;y<world.h;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(world.w,y);ctx.stroke()}
for(let i=0;i<35;i++){let x=(i*173)%world.w,y=(i*97)%world.h;ctx.fillStyle='#172c20';ctx.fillRect(x,y,35,28);ctx.fillStyle='#234532';ctx.fillRect(x+8,y+5,19,18)}
ctx.fillStyle='#1e4b35';ctx.beginPath();ctx.arc(world.w/2,world.h/2,110,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#4b9b6b';ctx.stroke();
for(const l of loot){ctx.fillStyle='#e2bd59';ctx.fillRect(l.x-7,l.y-7,14,14)}
for(const b of bullets){ctx.fillStyle='#ffe29b';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill()}
for(const z of zombies){ctx.save();ctx.translate(z.x,z.y);ctx.fillStyle='#4f9a62';ctx.beginPath();ctx.arc(0,0,z.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#17251c';ctx.beginPath();ctx.arc(-6,-3,3,0,Math.PI*2);ctx.arc(6,-3,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#b8e6a8';ctx.fillRect(-z.r,-z.r-8,z.r*2*(Math.max(0,z.hp)/(30+wave*4)),3);ctx.restore()}
ctx.save();ctx.translate(player.x,player.y);ctx.rotate(Math.atan2(lastDir.y,lastDir.x));ctx.fillStyle='#d9e9df';ctx.beginPath();ctx.arc(0,0,player.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#47e18b';ctx.fillRect(4,-5,25,10);ctx.fillStyle='#183e2a';ctx.beginPath();ctx.arc(-5,-5,3,0,Math.PI*2);ctx.fill();ctx.restore();
for(const p of particles){ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4);ctx.globalAlpha=1}
ctx.restore();
}
function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();if(running)requestAnimationFrame(loop)}
function setPad(e){const r=document.getElementById('pad').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let x=e.clientX-cx,y=e.clientY-cy,len=Math.hypot(x,y),max=r.width*.38;if(len>max){x=x/len*max;y=y/len*max}input.x=x/max;input.y=y/max;document.getElementById('stick').style.transform=`translate(${x}px,${y}px)`}
function clearPad(){input.x=0;input.y=0;document.getElementById('stick').style.transform='translate(0,0)'}
const pad=document.getElementById('pad');pad.addEventListener('pointerdown',e=>{input.active=true;pad.setPointerCapture(e.pointerId);setPad(e)});pad.addEventListener('pointermove',e=>{if(input.active)setPad(e)});pad.addEventListener('pointerup',clearPad);pad.addEventListener('pointercancel',clearPad);
document.getElementById('shoot').addEventListener('pointerdown',shoot);addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' ')shoot()});addEventListener('keyup',e=>keys[e.key]=false);
show('ULTIMA-ZONA','Sopravvivi alle ondate di zombie. Muoviti con il pad e spara con ⚡.','Inizia');
})();
</script>
</body>
</html>
