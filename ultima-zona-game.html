<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ULTIMA-ZONA — Sopravvivenza</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070a09;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%;background:#101713}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;z-index:5}
.panel{background:rgba(5,8,7,.78);border:1px solid #33463b;border-radius:12px;padding:8px 11px;backdrop-filter:blur(4px)}
.bar{width:150px;height:10px;background:#26312b;border-radius:8px;overflow:hidden;margin-top:4px}.fill{height:100%;background:#5ee08b;width:100%}
#ammo{font-weight:800;font-size:18px}
#msg{position:fixed;top:74px;left:50%;transform:translateX(-50%);z-index:6;text-align:center;font-weight:700;text-shadow:0 2px 8px #000}
#controls{position:fixed;inset:0;pointer-events:none;z-index:4}
#stick{position:absolute;left:22px;bottom:25px;width:126px;height:126px;border:2px solid rgba(255,255,255,.2);border-radius:50%;background:rgba(255,255,255,.05);pointer-events:auto}
#knob{position:absolute;width:54px;height:54px;left:34px;top:34px;border-radius:50%;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3)}
#fire{position:absolute;right:24px;bottom:35px;width:100px;height:100px;border-radius:50%;background:rgba(190,50,50,.3);border:2px solid rgba(255,150,150,.45);color:#fff;font-weight:900;font-size:18px;pointer-events:auto}
#reload{position:absolute;right:38px;bottom:148px;padding:12px 16px;border:1px solid #56675d;border-radius:12px;background:rgba(10,15,12,.8);color:#fff;font-weight:800;pointer-events:auto}
#start,#gameover{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at center,#18261e,#060807 70%);display:flex;align-items:center;justify-content:center;text-align:center;padding:25px}
.card{max-width:430px;background:rgba(10,15,12,.92);border:1px solid #34483b;border-radius:22px;padding:28px;box-shadow:0 20px 70px #000}
h1{font-size:42px;line-height:.9;margin:0 0 10px;letter-spacing:-2px}.accent{color:#7cf29f}
button.main{border:0;border-radius:14px;padding:15px 24px;background:#e8f7ed;color:#09100c;font-size:17px;font-weight:900;margin-top:16px}
small{opacity:.72}
.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="panel">❤️ <span id="hpText">100</span><div class="bar"><div id="hp" class="fill"></div></div></div>
  <div class="panel">🌊 Ondata <span id="wave">1</span><br>🧟 <span id="score">0</span></div>
  <div class="panel">🔫 <span id="ammo">12 / 12</span></div>
</div>
<div id="msg"></div>

<div id="controls">
  <div id="stick"><div id="knob"></div></div>
  <button id="reload">RICARICA</button>
  <button id="fire">FUOCO</button>
</div>

<div id="start">
 <div class="card">
  <h1>ULTIMA<br><span class="accent">ZONA</span></h1>
  <p>La città è caduta. Tu sei ancora vivo.<br><b>Sopravvivi alla prima ondata.</b></p>
  <p><small>Muoviti con il joystick. Mira verso il punto in cui tocchi lo schermo e premi FUOCO.</small></p>
  <button class="main" id="startBtn">INIZIA SOPRAVVIVENZA</button>
 </div>
</div>

<div id="gameover" class="hidden">
 <div class="card">
  <h1>SEI CADUTO</h1>
  <p>Hai eliminato <b id="finalScore">0</b> zombie.</p>
  <button class="main" id="restartBtn">RIPROVA</button>
 </div>
</div>

<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
let W,H,dpr,player,zombies=[],bullets=[],particles=[],running=false,last=0,spawn=0,wave=1,score=0,ammo=12,reloading=false,fireHeld=false,aim={x:0,y:0};
const keys={x:0,y:0};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

function reset(){
 player={x:W/2,y:H/2,r:16,hp:100,speed:175};
 zombies=[];bullets=[];particles=[];spawn=0;wave=1;score=0;ammo=12;reloading=false;
 document.getElementById('score').textContent=0;document.getElementById('wave').textContent=1;
 updateHud();
}
function updateHud(){
 document.getElementById('hpText').textContent=Math.max(0,Math.ceil(player.hp));
 document.getElementById('hp').style.width=Math.max(0,player.hp)+'%';
 document.getElementById('ammo').textContent=ammo+' / 12'+(reloading?' · …':'');
}
function start(){reset();running=true;document.getElementById('start').classList.add('hidden');document.getElementById('gameover').classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}
function end(){running=false;document.getElementById('finalScore').textContent=score;document.getElementById('gameover').classList.remove('hidden')}

function spawnZombie(){
 const side=Math.floor(Math.random()*4), pad=30; let x,y;
 if(side===0){x=Math.random()*W;y=-pad}else if(side===1){x=W+pad;y=Math.random()*H}else if(side===2){x=Math.random()*W;y=H+pad}else{x=-pad;y=Math.random()*H}
 zombies.push({x,y,r:15+Math.random()*5,hp:2+Math.floor(wave/3),speed:35+wave*4+Math.random()*22,hit:0});
}
function shoot(){
 if(!running||reloading||ammo<=0)return;
 ammo--;updateHud();
 const dx=aim.x-player.x,dy=aim.y-player.y,len=Math.hypot(dx,dy)||1;
 bullets.push({x:player.x+dx/len*18,y:player.y+dy/len*18,vx:dx/len*600,vy:dy/len*600,life:1.1});
 if(ammo===0) reload();
}
function reload(){
 if(reloading||ammo===12)return;
 reloading=true;updateHud();
 setTimeout(()=>{ammo=12;reloading=false;updateHud()},900);
}
function burst(x,y,n=5){
 for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=30+Math.random()*90;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.4})}
}
function loop(t){
 if(!running)return; const dt=Math.min((t-last)/1000,.035);last=t;
 update(dt);draw();requestAnimationFrame(loop)
}
function update(dt){
 player.x=Math.max(18,Math.min(W-18,player.x+keys.x*player.speed*dt));
 player.y=Math.max(18,Math.min(H-18,player.y+keys.y*player.speed*dt));
 spawn-=dt;
 const target=0.9-Math.min(.55,wave*.035);
 if(spawn<=0){spawn=target;spawnZombie()}
 if(score>=wave*12){wave++;document.getElementById('wave').textContent=wave;msg('ONDATA '+wave)}
 for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt}
 bullets=bullets.filter(b=>b.life>0&&b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);
 for(const z of zombies){
   const dx=player.x-z.x,dy=player.y-z.y,d=Math.hypot(dx,dy)||1;
   z.x+=dx/d*z.speed*dt;z.y+=dy/d*z.speed*dt;z.hit=Math.max(0,z.hit-dt);
   if(d<z.r+player.r){player.hp-=18*dt;updateHud()}
 }
 for(let i=zombies.length-1;i>=0;i--){
   let dead=false;
   for(let j=bullets.length-1;j>=0;j--){
     const b=bullets[j],z=zombies[i];
     if(Math.hypot(b.x-z.x,b.y-z.y)<z.r+5){z.hp--;bullets.splice(j,1);burst(z.x,z.y,3);if(z.hp<=0)dead=true;break}
   }
   if(dead){let z=zombies[i];burst(z.x,z.y,9);zombies.splice(i,1);score++;document.getElementById('score').textContent=score}
 }
 for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}
 particles=particles.filter(p=>p.life>0);
 if(player.hp<=0)end();
 updateHud();
}
function draw(){
 ctx.clearRect(0,0,W,H);
 // terreno
 ctx.fillStyle='#101713';ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='rgba(255,255,255,.035)';ctx.lineWidth=1;
 const grid=42;for(let x=0;x<W;x+=grid){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=grid){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 // zona centrale/base
 ctx.strokeStyle='rgba(110,230,145,.16)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(player.x,player.y,105,0,Math.PI*2);ctx.stroke();
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/.4);ctx.fillStyle='#d6f5df';ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 for(const b of bullets){ctx.fillStyle='#fff3a6';ctx.beginPath();ctx.arc(b.x,b.y,4,0,Math.PI*2);ctx.fill()}
 for(const z of zombies){
   ctx.fillStyle=z.hit>0?'#fff':'#a8d36e';ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,Math.PI*2);ctx.fill();
   ctx.fillStyle='#182018';ctx.beginPath();ctx.arc(z.x-5,z.y-2,2.5,0,Math.PI*2);ctx.arc(z.x+5,z.y-2,2.5,0,Math.PI*2);ctx.fill();
   ctx.fillStyle='#6b2525';ctx.fillRect(z.x-z.r,z.y-z.r-7,z.r*2*(z.hp/(2+Math.floor(wave/3))),3);
 }
 // player + aim direction
 const dx=aim.x-player.x,dy=aim.y-player.y,len=Math.hypot(dx,dy)||1;
 ctx.strokeStyle='#dceee2';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(player.x,player.y);ctx.lineTo(player.x+dx/len*25,player.y+dy/len*25);ctx.stroke();
 ctx.fillStyle='#5ee08b';ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();
}
function msg(s){const m=document.getElementById('msg');m.textContent=s;setTimeout(()=>{if(m.textContent===s)m.textContent=''},900)}

function setAim(x,y){aim={x,y}}
addEventListener('pointerdown',e=>{if(e.target.closest('#controls')||e.target.tagName==='BUTTON')return;setAim(e.clientX,e.clientY)});
addEventListener('pointermove',e=>{if(e.buttons)setAim(e.clientX,e.clientY)});
document.getElementById('fire').addEventListener('pointerdown',e=>{e.preventDefault();fireHeld=true;shoot()});
addEventListener('pointerup',()=>fireHeld=false);
setInterval(()=>{if(fireHeld)shoot()},170);
document.getElementById('reload').addEventListener('pointerdown',e=>{e.preventDefault();reload()});

const stick=document.getElementById('stick'),knob=document.getElementById('knob');let stickId=null;
function stickMove(e){
 const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy,d=Math.hypot(dx,dy),max=42;if(d>max){dx=dx/d*max;dy=dy/d*max}
 knob.style.transform=`translate(${dx}px,${dy}px)`;keys.x=dx/max;keys.y=dy/max;
}
stick.addEventListener('pointerdown',e=>{stickId=e.pointerId;stick.setPointerCapture(stickId);stickMove(e)});
stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)stickMove(e)});
stick.addEventListener('pointerup',()=>{stickId=null;keys.x=keys.y=0;knob.style.transform='translate(0,0)'});
document.getElementById('startBtn').onclick=start;
document.getElementById('restartBtn').onclick=start;
</script>
</body>
</html>
